<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIOJ — AI Olympiad Judge</title>
  <meta name="description" content="AIOJ 是一个面向 AI/ML 竞赛的智能在线评测平台，提供题目练习、比赛、排行榜等功能。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    if (window.location.hostname !== 'hello.yxyx.space') {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
      document.head.appendChild(link);
    }
  </script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/" data-link title="AIOJ">
          <div class="brand-logo-container">
            <svg class="brand-logo-svg" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <div class="brand-text-container">
            <div class="brand-title">AIOJ</div>
            <div class="brand-subtitle">AI Olympiad Judge</div>
          </div>
        </a>

        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" type="button" aria-label="收起侧边栏" aria-pressed="false" title="收起侧边栏">
          <svg class="collapse-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
      </div>

      <nav class="nav" id="mainNav">
        <div class="nav-section-title">主要导航</div>
        
        <a class="nav-link" data-route="/" href="/" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9"></rect>
              <rect x="14" y="3" width="7" height="5"></rect>
              <rect x="14" y="12" width="7" height="9"></rect>
              <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
          </span>
          <span class="nav-text">平台概览</span>
        </a>
        
        <a class="nav-link" data-route="/problems" href="/problems" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </span>
          <span class="nav-text">公开题库</span>
        </a>
        
        <a class="nav-link" data-route="/contests" href="/contests" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="7"></circle>
              <path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"></path>
            </svg>
          </span>
          <span class="nav-text">竞技比赛</span>
        </a>
        
        <a class="nav-link" data-route="/submissions" href="/submissions" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
          </span>
          <span class="nav-text">提交记录</span>
        </a>

        <a class="nav-link" data-route="/notifications" href="/notifications" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
              <path d="M9 17a3 3 0 0 0 6 0"></path>
            </svg>
          </span>
          <span class="nav-text">通知中心</span>
        </a>

        <a class="nav-link" id="backToMainLink" href="https://yxyx.space">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span class="nav-text">主站</span>
        </a>

        <a class="nav-link" data-route="/messages" href="/messages" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
              <path d="M8 9h8"></path>
              <path d="M8 13h5"></path>
            </svg>
          </span>
          <span class="nav-text">聊天</span>
        </a>

        <a class="nav-link" id="cloudDriveLink" href="https://drive.yxyx.space">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
          </span>
          <span class="nav-text">云盘<span id="cloudDriveQuota" class="nav-quota" style="font-size: 11px; opacity: 0.65; margin-left: 6px; font-weight: normal;"></span></span>
        </a>
        
        <a class="nav-link" data-route="/account" href="/account" data-link>
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span class="nav-text">个人中心</span>
        </a>
      </nav>

      <div id="adminNav" style="display:none;">
        <div class="nav-section-title">系统管理</div>
        <nav class="nav">
          <a class="nav-link" data-route="/admin/users" href="/admin/users" data-link>
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </span>
            <span class="nav-text">用户管理</span>
          </a>
          
          <a class="nav-link" data-route="/problem-admin" href="/problem-admin" data-link>
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </span>
            <span class="nav-text">题目管理</span>
          </a>
          
          <a class="nav-link" data-route="/contest-admin" href="/contest-admin" data-link>
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
            <span class="nav-text">比赛管理</span>
          </a>

          <a class="nav-link" data-route="/judge-admin" href="/judge-admin" data-link>
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l3 6 6 .9-4.5 4.4 1.1 6.2L12 16.8 6.4 19.5l1.1-6.2L3 8.9 9 8z"></path>
                <path d="M12 8v4"></path>
                <path d="M12 16h.01"></path>
              </svg>
            </span>
            <span class="nav-text">评测运维</span>
          </a>

          <a class="nav-link" data-route="/admin/audit" href="/admin/audit" data-link>
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </span>
            <span class="nav-text">审计日志</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer" id="sidebarUser">
        <span class="text-muted">未连接到账户</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main">
      <!-- Top Floating Header -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="menuBtn" aria-label="打开侧边栏">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <div class="page-title-box">
            <h1 class="page-title" id="pageTitle">AIOJ</h1>
            <div class="page-subtitle" id="pageSubtitle"></div>
          </div>
        </div>
        
        <div class="top-actions">
          <span class="status-indicator" id="apiStatus">
            <span class="status-dot"></span>
            <span class="status-text">系统检测中</span>
          </span>

          <button class="btn btn-secondary btn-sm" id="notificationBtn" aria-label="打开通知中心" style="display:none; position: relative;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
              <path d="M9 17a3 3 0 0 0 6 0"></path>
            </svg>
            <span id="notificationBadge" style="display:none; position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--color-danger); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center;">0</span>
          </button>

          <button class="btn btn-secondary btn-sm" id="messageBtn" aria-label="打开聊天" style="display:none; position: relative;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
              <path d="M8 9h8"></path>
              <path d="M8 13h5"></path>
            </svg>
            <span id="messageBadge" style="display:none; position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--color-danger); color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center;">0</span>
          </button>
          
          <!-- Theme Toggle Button -->
          <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换主题模式" onclick="toggleTheme()">
            <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          
          <div class="auth-box">
            <div class="user-dropdown-container" id="userDropdownContainer" style="display:none;">
              <div class="user-profile-capsule" id="userPill"></div>
              <div class="dropdown-menu" id="userDropdownMenu">
                <a class="dropdown-item" href="/notifications" data-link>
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
                    <path d="M9 17a3 3 0 0 0 6 0"></path>
                  </svg>
                  通知中心
                </a>
                <a class="dropdown-item" href="/messages" data-link>
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
                    <path d="M8 9h8"></path>
                    <path d="M8 13h5"></path>
                  </svg>
                  我的聊天
                </a>
                <a class="dropdown-item" id="profileHomeLink" href="/account" data-link>
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20a6 6 0 0 0-12 0"></path>
                    <circle cx="12" cy="10" r="4"></circle>
                    <circle cx="12" cy="12" r="10"></circle>
                  </svg>
                  个人主页
                </a>
                <a class="dropdown-item" href="/account" data-link>
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  个人中心
                </a>
                <button class="dropdown-item text-danger" id="logoutBtn">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  退出登录
                </button>
              </div>
            </div>
            <button class="btn btn-primary btn-sm" id="authBtn">登录 / 注册</button>
          </div>
        </div>
      </header>

      <!-- App View Container -->
      <section class="content animate-fade-in" id="app">
        <div class="loading-overlay">
          <div class="spinner-ring"></div>
          <span class="loading-text" id="mainLoadingText">正在加载智能评测系统...</span>
        </div>
      </section>
      <script>
        if (window.location.hostname === 'hello.yxyx.space') {
          document.body.classList.add('chat-only-mode');
          document.title = 'Chat — 在线聊天系统';
          const t = document.getElementById('mainLoadingText');
          if (t) t.textContent = '正在加载在线聊天...';
          const logoContainer = document.querySelector('.brand-logo-container');
          if (logoContainer) {
            logoContainer.innerHTML = `
              <svg class="brand-logo-svg" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
              </svg>
            `;
          }
          const brandTitle = document.querySelector('.brand-title');
          if (brandTitle) brandTitle.textContent = 'Chat';
          const brandSubtitle = document.querySelector('.brand-subtitle');
          if (brandSubtitle) brandSubtitle.textContent = '在线聊天';
          const brand = document.querySelector('.brand');
          if (brand) brand.title = 'Chat';
          const desc = document.querySelector('meta[name="description"]');
          if (desc) desc.setAttribute('content', '一个简洁、智能、安全的在线聊天系统。');
        }
      </script>
    </main>
  </div>

  <!-- Unified Modal Dialog (glassmorphism style) -->
  <div class="modal-backdrop" id="modalRoot">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">对话框标题</h2>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="关闭对话框">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.min.js"></script>
  <script>
    if (window.location.hostname !== 'hello.yxyx.space') {
      const scripts = [
        'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js',
        'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
      ];
      scripts.forEach(src => {
        const s = document.createElement('script');
        s.src = src;
        s.async = false;
        document.body.appendChild(s);
      });
    }
  </script>
  <script src="/chat-api.js"></script>
  <script src="/app.js"></script>
</body>
</html>
