<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIOJ</title>
  <!-- History Router enabled -->
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/">
        <div class="brand-logo">AI</div>
        <div>
          <div class="brand-title">AIOJ</div>
          <div class="brand-subtitle">AI Olympiad Judge</div>
        </div>
      </a>

      <div class="nav">
        <a class="nav-link" data-route="/" href="/"><span class="nav-icon">⌂</span>概览</a>
        <a class="nav-link" data-route="/problems" href="/problems"><span class="nav-icon">▦</span>题库</a>
        <a class="nav-link" data-route="/contests" href="/contests"><span class="nav-icon">🏆</span>比赛</a>
        <a class="nav-link" data-route="/submissions" href="/submissions"><span class="nav-icon">↥</span>提交</a>
        <a class="nav-link" data-route="/account" href="/account"><span class="nav-icon">♟</span>账号设置</a>
      </div>

      <div id="adminNav">
        <div class="nav-section-title">Admin</div>
        <div class="nav">
          <a class="nav-link" data-route="/admin/users" href="/admin/users"><span class="nav-icon">👥</span>用户管理</a>
          <a class="nav-link" data-route="/problem-admin" href="/problem-admin"><span class="nav-icon">⚙</span>题目管理</a>
          <a class="nav-link" data-route="/contest-admin" href="/contest-admin"><span class="nav-icon">⚙</span>比赛管理</a>
        </div>
      </div>

      <div class="sidebar-footer" id="sidebarUser">
        未登录<br />
        <span class="muted">https://yxyx.space</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="row">
          <button class="button ghost mobile-menu" id="menuBtn">☰</button>
          <div>
            <h1 class="page-title" id="pageTitle">AIOJ</h1>
            <div class="page-subtitle" id="pageSubtitle">Loading...</div>
          </div>
        </div>
        <div class="top-actions">
          <span class="status-online" id="apiStatus">API checking</span>
          <span class="user-pill" id="userPill">未登录</span>
          <button class="button" id="authBtn">登录</button>
          <button class="button danger" id="logoutBtn" style="display:none;">退出</button>
        </div>
      </header>

      <section class="content" id="app"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalRoot" onclick="modalBackdropClick(event)">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="card-title" id="modalTitle">Modal</h2>
        <button class="button ghost small" onclick="closeModal()">关闭</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

    <script src="/app.js"></script>
</body>
</html>
