services:
  postgres:
    image: postgres:16
    container_name: aioj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aioj-net

  redis:
    image: redis:7
    container_name: aioj-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aioj-net

  minio:
    image: minio/minio
    container_name: aioj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - aioj-net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aioj-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_PROBLEMS: aioj-problems
      S3_BUCKET_SUBMISSIONS: aioj-submissions
      S3_BUCKET_LOGS: aioj-logs
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_SECONDS: 604800
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yxyx.space,https://www.yxyx.space,http://127.0.0.1,http://localhost,http://127.0.0.1:8000,http://localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_ON_STARTUP: "true"
      ALLOW_INSECURE_ADMIN_PASSWORD: "false"
      MAX_SOURCE_ZIP_MB: 20
      MAX_SOURCE_FILES: 50
      MAX_SOURCE_UNCOMPRESSED_MB: 50
      MAX_PROBLEM_ZIP_MB: 200
      MAX_PROBLEM_FILES: 500
      MAX_PROBLEM_UNCOMPRESSED_MB: 1024
      STALE_JOB_MINUTES: 15
      MAX_JOB_ATTEMPTS: 3
      JUDGE_NODE_NAME: api-local-worker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - aioj-net

  caddy:
    image: caddy:2
    container_name: aioj-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - aioj-net

networks:
  aioj-net:
    driver: bridge
